[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
# Monad is not on Etherscan; verification skipped or via monadscan

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
